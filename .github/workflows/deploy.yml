name: Deploy SIM-PBL to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sim-pbl-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Backup, deploy, and activate
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 60

    steps:
      - name: Prepare SSH connection
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -euo pipefail
          test -n "${SSH_PRIVATE_KEY}" || { echo "ERROR: EC2_SSH_KEY kosong"; exit 1; }
          test -n "${EC2_HOST}" || { echo "ERROR: EC2_HOST kosong"; exit 1; }

          mkdir -p ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "${EC2_HOST}" >> ~/.ssh/known_hosts

      - name: Create production backup
        id: backup
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          DEPLOY_PATH: ${{ secrets.EC2_DEPLOY_PATH }}
          TARGET_COMMIT: ${{ github.sha }}
          BACKUP_CNF: /etc/sim-pbl/backup.cnf
          BACKUP_ROOT: /var/backups/sim-pbl
        run: |
          set -euo pipefail
          test -n "${EC2_USER}" || { echo "ERROR: EC2_USER kosong"; exit 1; }
          test -n "${DEPLOY_PATH}" || { echo "ERROR: EC2_DEPLOY_PATH kosong"; exit 1; }

          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          BACKUP_FILE="${BACKUP_ROOT}/${STAMP}/database.sql.gz"
          mkdir -p "${RUNNER_TEMP}/sim-pbl-backup"

          PREVIOUS_COMMIT="$(ssh -o BatchMode=yes -o ConnectTimeout=15 -i ~/.ssh/id_ed25519 "${EC2_USER}@${EC2_HOST}" \
            "DEPLOY_PATH='${DEPLOY_PATH}' TARGET_COMMIT='${TARGET_COMMIT}' BACKUP_CNF='${BACKUP_CNF}' BACKUP_ROOT='${BACKUP_ROOT}' BACKUP_FILE='${BACKUP_FILE}' bash -s" <<'ENDSSH'
          set -euo pipefail
          cd "$DEPLOY_PATH"

          if ! printf '%s' "$TARGET_COMMIT" | grep -Eq '^[0-9a-fA-F]{40}$'; then
            echo "ERROR: github.sha bukan full commit SHA." >&2
            exit 1
          fi

          PREVIOUS_COMMIT="$(git rev-parse HEAD)"
          git fetch --quiet origin main
          git cat-file -e "${TARGET_COMMIT}^{commit}"
          git merge-base --is-ancestor "$TARGET_COMMIT" origin/main || {
            echo "ERROR: target commit bukan bagian dari origin/main." >&2
            exit 1
          }
          git merge-base --is-ancestor "$PREVIOUS_COMMIT" "$TARGET_COMMIT" || {
            echo "ERROR: target commit bukan fast-forward dari HEAD server." >&2
            exit 1
          }

          DB_NAME="$(php -r 'require "vendor/autoload.php"; $app = require "bootstrap/app.php"; $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap(); echo config("database.connections.".config("database.default").".database");')"
          test -n "$DB_NAME" || { echo "ERROR: nama database tidak ditemukan." >&2; exit 1; }
          sudo test -r "$BACKUP_CNF" || { echo "ERROR: root tidak dapat membaca backup config." >&2; exit 1; }
          command -v mysqldump >/dev/null 2>&1 || { echo "ERROR: mysqldump tidak tersedia." >&2; exit 1; }

          sudo install -d -o root -g root -m 700 "$BACKUP_ROOT" "$(dirname "$BACKUP_FILE")"
          echo "[backup] creating $BACKUP_FILE" >&2
          sudo bash -o pipefail -c 'mysqldump --defaults-extra-file="$1" --single-transaction --quick --routines --triggers --no-tablespaces --set-gtid-purged=OFF "$2" | gzip -9 > "$3"' _ "$BACKUP_CNF" "$DB_NAME" "$BACKUP_FILE"

          sudo test -s "$BACKUP_FILE"
          sudo gzip -t "$BACKUP_FILE"
          sudo bash -c 'zcat "$1" | grep -q "CREATE TABLE"' _ "$BACKUP_FILE" || {
            echo "ERROR: backup tidak tampak seperti dump SQL." >&2
            exit 1
          }
          sudo bash -c 'sha256sum "$1" > "$1.sha256"' _ "$BACKUP_FILE"
          sudo chmod 600 "$BACKUP_FILE" "$BACKUP_FILE.sha256"
          printf 'previous_commit=%s\ntarget_commit=%s\nbackup=%s\ncreated_at=%s\n' \
            "$PREVIOUS_COMMIT" "$TARGET_COMMIT" "$BACKUP_FILE" "$(date -u +%Y%m%dT%H%M%SZ)" \
            | sudo tee "$(dirname "$BACKUP_FILE")/deploy-meta.txt" >/dev/null
          sudo chmod 600 "$(dirname "$BACKUP_FILE")/deploy-meta.txt"

          printf '%s\n' "$PREVIOUS_COMMIT"
          ENDSSH
          )"

          echo "previous_commit=${PREVIOUS_COMMIT}" >> "$GITHUB_OUTPUT"
          echo "backup_file=${BACKUP_FILE}" >> "$GITHUB_OUTPUT"
          echo "[backup] transferring verified backup to GitHub Actions runner"
          ssh -o BatchMode=yes -o ConnectTimeout=15 -i ~/.ssh/id_ed25519 "${EC2_USER}@${EC2_HOST}" \
            "sudo cat '${BACKUP_FILE}'" > "${RUNNER_TEMP}/sim-pbl-backup/database.sql.gz"

          REMOTE_SHA="$(ssh -o BatchMode=yes -o ConnectTimeout=15 -i ~/.ssh/id_ed25519 "${EC2_USER}@${EC2_HOST}" \
            "sudo sha256sum '${BACKUP_FILE}'" | cut -d ' ' -f1)"
          printf '%s  %s\n' "${REMOTE_SHA}" "${RUNNER_TEMP}/sim-pbl-backup/database.sql.gz" | sha256sum -c -
          gzip -t "${RUNNER_TEMP}/sim-pbl-backup/database.sql.gz"
          printf 'target_commit=%s\nprevious_commit=%s\nbackup_path=%s\nsha256=%s\ncreated_at=%s\n' \
            "${TARGET_COMMIT}" "${PREVIOUS_COMMIT}" "${BACKUP_FILE}" "${REMOTE_SHA}" "${STAMP}" \
            > "${RUNNER_TEMP}/sim-pbl-backup/deploy-meta.txt"

      - name: Encrypt backup before off-instance storage
        env:
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "${BACKUP_ENCRYPTION_PASSPHRASE}" || {
            echo "ERROR: GitHub secret BACKUP_ENCRYPTION_PASSPHRASE belum diatur."
            exit 1
          }
          command -v gpg >/dev/null 2>&1 || { echo "ERROR: gpg tidak tersedia di runner."; exit 1; }

          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "${BACKUP_ENCRYPTION_PASSPHRASE}" \
            --symmetric --cipher-algo AES256 \
            --output "${RUNNER_TEMP}/sim-pbl-backup/database.sql.gz.gpg" \
            "${RUNNER_TEMP}/sim-pbl-backup/database.sql.gz"

          test -s "${RUNNER_TEMP}/sim-pbl-backup/database.sql.gz.gpg"
          rm -f "${RUNNER_TEMP}/sim-pbl-backup/database.sql.gz"

      - name: Store encrypted off-instance backup in GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: sim-pbl-production-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/sim-pbl-backup/database.sql.gz.gpg
            ${{ runner.temp }}/sim-pbl-backup/deploy-meta.txt
          if-no-files-found: error
          retention-days: 30

      - name: Deploy code and run migrations
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          DEPLOY_PATH: ${{ secrets.EC2_DEPLOY_PATH }}
          TARGET_COMMIT: ${{ github.sha }}
          PREVIOUS_COMMIT: ${{ steps.backup.outputs.previous_commit }}
        run: |
          set -euo pipefail

          ssh -o BatchMode=yes -o ConnectTimeout=15 -i ~/.ssh/id_ed25519 \
            "${EC2_USER}@${EC2_HOST}" \
            "DEPLOY_PATH='${DEPLOY_PATH}' TARGET_COMMIT='${TARGET_COMMIT}' PREVIOUS_COMMIT='${PREVIOUS_COMMIT}' bash -s" <<'ENDSSH'
          set -euo pipefail
          cd "$DEPLOY_PATH"

          CURRENT_COMMIT="$(git rev-parse HEAD)"
          if [ "$CURRENT_COMMIT" != "$PREVIOUS_COMMIT" ]; then
            echo "ERROR: HEAD server berubah setelah backup; deployment dibatalkan."
            exit 1
          fi

          echo "[maintenance] enabling"
          php artisan down --retry=60

          echo "[code] fast-forward to $TARGET_COMMIT"
          git merge --ff-only "$TARGET_COMMIT"

          echo "[dependencies]"
          composer install --no-dev --optimize-autoloader --no-interaction
          npm ci
          npm run build

          echo "[migration]"
          php artisan migrate --force
          php scripts/deploy-verify-schema.php

          echo "[cache]"
          php artisan optimize:clear
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

          PHP_FPM_SERVICE="$(systemctl list-units --type=service --state=running --no-legend 'php*-fpm.service' | awk 'NR == 1 {print $1}')"
          if [ -z "$PHP_FPM_SERVICE" ]; then
            echo "ERROR: service PHP-FPM aktif tidak ditemukan."
            exit 1
          fi
          echo "[php-fpm] reload $PHP_FPM_SERVICE"
          sudo systemctl reload "$PHP_FPM_SERVICE"

          echo "[maintenance] disabling"
          php artisan up

          echo "DEPLOY_OK target=$TARGET_COMMIT"
          ENDSSH

      - name: Recovery guidance
        if: failure()
        run: |
          echo "Deployment gagal. Periksa langkah yang gagal sebelum tindakan pemulihan."
          echo "Jika maintenance sudah aktif, aplikasi mungkin masih menampilkan halaman maintenance."
          echo "Backup database tersimpan sebagai artifact GitHub Actions jika langkah upload berhasil."
          echo "Jangan menjalankan migrate:rollback, git reset --hard, seeder, atau restore otomatis."
